name: Build APK

# Manual, on-demand APK build. GitHub's runners have their own network path to
# Maven Central/Google's repos, so this sidesteps any dependency-download rate
# limiting a shared sandbox IP might hit. Signing falls back to the repo's
# committed everyone.keystore (see Common/build.gradle) when no private
# thekeypassword/thekeyalias/thekeyfile/thepassword gradle properties are
# configured for this repo, so no secrets are required to run this workflow.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle assemble task (build variant)'
        required: false
        default: 'assembleMobileReleasedub'
      abi:
        description: 'Restrict native libs to one ABI for a faster/smaller build (e.g. arm64-v8a). Leave empty for a universal APK.'
        required: false
        default: 'arm64-v8a'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # android-actions/setup-android@v3 fails outright right now: it always tries to install
      # the legacy standalone "tools" package, which Google has removed from the SDK repository
      # ("Warning: Failed to find package 'tools'" -> sdkmanager exits 1 -> the action throws).
      # ubuntu-latest already ships a full SDK with cmdline-tools preinstalled under
      # $ANDROID_HOME. Pre-installing this project's exact compileSdk/build-tools/ndk/cmake
      # package IDs by hand ran into the same class of problem (sdkmanager's cached repository
      # listing didn't have "platforms;android-37" under that exact id). AGP already knows how
      # to resolve and download whatever compileSdk/buildToolsVersion/ndkVersion/cmake version
      # Common/build.gradle asks for, given accepted licenses and a writable SDK dir — both
      # already true here — so only accept licenses and leave the rest to the Gradle build.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-apk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-apk-

      - name: Cache Android NDK/CMake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/cmake
          key: ${{ runner.os }}-android-native-${{ hashFiles('Common/build.gradle') }}

      - name: Build APK
        run: |
          ABI_ARG=""
          if [ -n "${{ inputs.abi }}" ]; then
            ABI_ARG="-PjugglucoAbi=${{ inputs.abi }}"
          fi
          ./gradlew ":Common:${{ inputs.task }}" --no-daemon $ABI_ARG

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JugglucoNG-apk
          path: Common/build/outputs/apk/**/*.apk
          if-no-files-found: error
